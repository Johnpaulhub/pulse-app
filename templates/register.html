<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Pulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-zinc-950 border border-zinc-800 p-8 rounded-2xl shadow-xl">
        <div class="text-center mb-6">
            <span class="text-yellow-400 font-bold text-3xl">⚡ Pulse</span>
            <p class="text-xs text-zinc-500 mt-1">Create an account to join</p>
        </div>
        {% if error %}
        <div class="bg-red-950 border border-red-800 text-red-300 text-xs p-3 rounded-lg mb-4 text-center">{{ error }}</div>
        {% endif %}
        <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-zinc-400 mb-1">Choose Username</label>
                <input type="text" name="username" required placeholder="Username" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-yellow-400">
            </div>
            <div>
                <label class="block text-xs font-semibold text-zinc-400 mb-1">Choose Password</label>
                <input type="password" name="password" required placeholder="Password" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-yellow-400">
            </div>
            <button type="submit" class="w-full bg-yellow-400 text-black font-bold py-3 rounded-full text-sm hover:bg-yellow-500 transition-colors mt-2">Sign Up</button>
        </form>
        <p class="text-xs text-zinc-500 text-center mt-6">Already have an account? <a href="{{ url_for('login') }}" class="text-yellow-400 font-bold">Log In</a></p>
    </div>
</body>
</html>
