<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox - Pulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen">
    <nav class="flex justify-between items-center p-4 border-b border-zinc-800 bg-zinc-950 sticky top-0 z-50">
        <span class="text-yellow-400 font-bold text-xl">⚡ Pulse</span>
        <div class="flex items-center space-x-6 text-sm">
            <a href="{{ url_for('index') }}" class="text-zinc-400 hover:text-white">Home</a>
            <a href="{{ url_for('notifications') }}" class="text-white font-semibold">Inbox</a>
            <a href="{{ url_for('logout') }}" class="text-red-400">Logout</a>
        </div>
    </nav>
    <div class="max-w-xl mx-auto p-4">
        <h2 class="text-lg font-bold mb-4 text-yellow-400">Notifications</h2>
        <div class="space-y-3">
            {% for notif in notifications %}
            <div class="bg-zinc-950 border border-zinc-800 p-4 rounded-xl flex justify-between items-center">
                <p class="text-sm text-zinc-200">{{ notif.message }}</p>
                <span class="text-xs text-zinc-500">{{ notif.created_at }}</span>
            </div>
            {% else %}
            <p class="text-zinc-500 text-sm text-center py-8">No notifications yet.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
